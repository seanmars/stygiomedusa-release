<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>夜航六儀表</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#161616;color:#F2F2F2;font-family:"Microsoft JhengHei UI","Segoe UI",sans-serif;position:relative}
h1{position:absolute;left:80px;top:56px;font-size:56px}
.dl{position:absolute;right:80px;top:56px;height:68px;padding:0 36px;background:#F2F2F2;color:#0A0A0A;font-size:28px;font-weight:700;display:flex;align-items:center;border-radius:4px}
.grid{position:absolute;left:180px;top:170px;display:grid;grid-template-columns:repeat(3,300px);gap:40px 60px}
.g{width:300px;height:300px;border-radius:50%;background:#0A0A0A;border:10px solid #262626;position:relative}
.g::after{content:"";position:absolute;left:146px;top:40px;width:8px;height:110px;background:#F2F2F2;transform-origin:4px 110px;transform:rotate(var(--r))}
.g span{position:absolute;left:0;right:0;bottom:56px;text-align:center;font-size:26px;letter-spacing:.1em}
.tb{position:absolute;left:0;right:0;bottom:0;height:56px;background:#202020}
</style></head><body>
<h1>一眼掃過, 數值與趨勢都在</h1><div class="dl">下載 v0.8.0</div>
<div class="grid">
<div class="g" style="--r:-40deg"><span>CLAUDE 5h</span></div><div class="g" style="--r:30deg"><span>CLAUDE 7d</span></div><div class="g" style="--r:-10deg"><span>PACE</span></div>
<div class="g" style="--r:60deg"><span>CODEX 5h</span></div><div class="g" style="--r:-70deg"><span>CODEX 7d</span></div><div class="g" style="--r:10deg"><span>重置</span></div>
</div>
<div class="tb"></div>
</body></html>
