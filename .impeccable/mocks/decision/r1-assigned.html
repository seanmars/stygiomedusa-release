<!doctype html>

<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#0A1A33;color:#DCEAF4;font-family:"Microsoft JhengHei UI","Segoe UI",sans-serif;position:relative}
.head{position:absolute;left:72px;right:72px;top:48px;display:flex;align-items:flex-end;border-bottom:2px solid #DCEAF4;padding-bottom:20px}
.head h1{font-size:64px;font-weight:700;line-height:1.1}
.head .sub{font-size:24px;margin-left:28px;margin-bottom:10px;color:#8FC1E0}
.dl{margin-left:auto;height:72px;padding:0 40px;background:#DCEAF4;color:#0A1A33;font-size:30px;font-weight:700;display:flex;align-items:center;border-radius:4px}
.chart{position:absolute;left:72px;top:200px;width:900px;height:430px;background:#13355C;border-radius:4px}
.chart svg{position:absolute;inset:0}
.read{position:absolute;left:1010px;top:200px;width:358px}
.read .k{font-size:24px;color:#8FC1E0;letter-spacing:.1em}

table{width:100%;border-collapse:collapse;font-family:Consolas,monospace;font-size:26px}
td{border-top:1px solid #2d5480;padding:12px 0}
td:last-child{text-align:right}
.tb{position:absolute;left:0;right:0;bottom:0;height:64px;background:#202020;display:flex;align-items:center;padding:0 24px;gap:18px;border-top:2px solid #8FC1E0}
.ic{width:32px;height:32px;border-radius:6px;background:#3a3a3a}
.wid{margin-left:auto;display:flex;gap:16px;margin-right:140px}
.bar{width:110px}.bar i{display:block;height:7px;border-radius:4px;background:#3a3a3a;margin:6px 0}.bar i u{display:block;height:100%;border-radius:4px;background:#4CC2FF}
.water{position:absolute;left:72px;top:660px;font-size:24px;color:#8FC1E0}
.slime{position:absolute;right:-30px;top:300px;width:116px;height:240px;border-radius:58px 0 0 58px;background:#050b16}
.slime::before,.slime::after{content:"";position:absolute;left:22px;width:62px;height:62px;border-radius:50%;border:6px solid #4CC2FF;border-right-color:#C2367E}
.slime::before{top:34px}.slime::after{top:136px}
</style></head><body>
